# O lakehouse local: os motores de verdade que substituíram o LocalStack.
#
# A diferença não é de ferramenta, é de propósito. O emulador criava recursos da
# AWS e nunca executava a lógica; aqui não existe recurso nenhum da AWS, e a
# lógica roda de verdade — o mesmo PySpark, lendo e escrevendo Iceberg sobre um
# S3 real, com um catálogo real.
#
# Ver ../../adr/0001-rodar-local-sem-emular-a-nuvem.md.
#
#   docker compose up -d
#   docker compose exec glue spark-submit /workspace/workloads/<...>.py

name: dataeng-lakehouse

services:
  # S3 de verdade, não emulado. MinIO implementa a API do S3, então o mesmo
  # código que fala com s3:// na AWS fala com ele aqui.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      # 9002 e não 9000: a porta nativa do ClickHouse é 9000, e os dois stacks
      # sobem juntos. Dentro da rede do Docker os serviços continuam falando
      # com `minio:9000` — só o mapeamento para a sua máquina mudou.
      - "9002:9000"   # API S3
      - "9001:9001"   # console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [lakehouse]

  # Cria os buckets com os MESMOS nomes que platform/aws/foundation cria na AWS.
  # Se divergirem, o script que roda local deixa de ser o script que roda lá.
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: lakehouse-minio-setup
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      for b in sandbox-lake-configs sandbox-lake-raw-local sandbox-lake-curated-local sandbox-lake-logs-local sandbox-lakehouse; do
        mc mb --ignore-existing local/$$b;
      done &&
      echo 'buckets prontos'
      "
    networks: [lakehouse]

  # O banco do catálogo. Sem ele o iceberg-rest-fixture usa um JDBC em memória
  # que NÃO aguenta escrita concorrente: com as três dimensões do amazonsales
  # rodando em paralelo, o catálogo devolve
  # "ServiceFailureException: Failed to get table ... from catalog rest_backend".
  #
  # Não é limitação do Iceberg nem do desenho da pipeline — é do backend padrão
  # da imagem de teste. O paralelismo é de propósito e foi mantido.
  catalog-db:
    image: postgres:16
    container_name: lakehouse-catalog-db
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    networks: [lakehouse]

  # O catálogo. Na AWS quem dá semântica de tabela aos arquivos é o S3 Tables;
  # aqui é um catálogo Iceberg REST — a mesma especificação, sem o gerenciamento.
  iceberg-rest:
    build: ./iceberg-rest
    image: dataeng-sandbox/iceberg-rest:1.9.2-pg
    container_name: lakehouse-iceberg-rest
    depends_on:
      minio-setup: { condition: service_completed_successfully }
      catalog-db: { condition: service_healthy }
    environment:
      CATALOG_URI: jdbc:postgresql://catalog-db:5432/iceberg
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_WAREHOUSE: s3://sandbox-lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    networks: [lakehouse]

  # A imagem oficial da AWS para desenvolvimento de Glue. Traz o mesmo Spark e
  # as mesmas bibliotecas do Glue 5.0 que rodam na nuvem — é o que aproxima o
  # local do real sem emular API nenhuma.
  #
  # Fica viva sem fazer nada para você entrar nela:
  #   docker compose exec glue bash
  glue:
    build: ./glue
    image: dataeng-sandbox/glue:5.0.10-gx
    container_name: lakehouse-glue
    depends_on:
      iceberg-rest: { condition: service_started }
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL_S3: http://minio:9000
      # Lido pelos scripts para saber onde o catálogo responde.
      ICEBERG_REST_URI: http://iceberg-rest:8181
    volumes:
      # O repositório inteiro, para rodar os scripts sem copiar nada.
      # Três níveis: este compose está em platform/local/lakehouse/.
      - ../../..:/workspace:ro
    working_dir: /workspace
    # O ENTRYPOINT da imagem é `bash -l`, então o command entra como argumento
    # dele. `["tail","-f","/dev/null"]` viraria `bash -l tail -f /dev/null` —
    # bash trataria "tail" como nome de script, não acharia, e sairia com 0 sem
    # dizer nada. Foi o que aconteceu na primeira tentativa.
    command: ["-c", "tail -f /dev/null"]
    networks: [lakehouse]

  # A MESMA pilha, sem nada da AWS. Apache Spark de código aberto, com os jars
  # do Iceberg baixados por --packages no primeiro uso.
  #
  # Por que existir tendo o `glue`: os dois respondem a perguntas diferentes.
  #   glue       fidelidade — é o runtime que roda na nuvem, com as libs awsglue
  #   spark-oss  portabilidade — prova que o código não depende de fornecedor
  #
  # Se um script roda aqui, ele roda em qualquer Spark: EMR, Databricks,
  # Kubernetes, sua máquina. Se só roda no `glue`, alguma amarra existe — e
  # descobrir qual é justamente o exercício.
  #
  #   docker compose --profile oss up -d
  #   docker compose exec spark-oss spark-submit \
  #     --packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.9.2,org.apache.iceberg:iceberg-aws-bundle:1.9.2 \
  #     /workspace/<script>.py
  spark-oss:
    profiles: ["oss"]
    build: ./spark-oss
    image: dataeng-sandbox/spark-oss:3.5.7-gx
    container_name: lakehouse-spark-oss
    user: root
    depends_on:
      iceberg-rest: { condition: service_started }
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL_S3: http://minio:9000
      ICEBERG_REST_URI: http://iceberg-rest:8181
      # Cache dos jars entre execuções, para o --packages não rebaixar tudo.
      HOME: /tmp
    volumes:
      - ../../..:/workspace:ro
      - spark-oss-ivy:/tmp/.ivy2
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"]
    networks: [lakehouse]

  # Trino: o motor por trás do Athena. Na AWS você paga por bytes escaneados e
  # a AWS opera o cluster; aqui é o mesmo motor, operado por você.
  #
  # Existe para uma pergunta que o Spark sozinho não responde: as tabelas
  # Iceberg escritas por um motor são legíveis por outro, sem cópia e sem
  # sincronização? É a afirmação do platform/aws/foundation/adr/0001.
  #
  #   docker compose --profile oss up -d
  #   docker compose exec trino trino --execute "SELECT * FROM iceberg.ns.tabela"
  trino:
    profiles: ["oss"]
    image: trinodb/trino:476
    container_name: lakehouse-trino
    depends_on:
      iceberg-rest: { condition: service_started }
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    networks: [lakehouse]

volumes:
  minio-data:
  catalog-db-data:
  spark-oss-ivy:

networks:
  lakehouse:
    name: dataeng-lakehouse
