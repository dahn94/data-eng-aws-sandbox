# O alicerce do ambiente local: armazenamento e os buckets.
#
# Espelha `platform/aws/foundation`, que cria os buckets S3 na nuvem. Aqui quem
# fala a API do S3 é o MinIO, e os buckets nascem com OS MESMOS NOMES — se
# divergissem, o script que roda local deixaria de ser o script que roda lá.
#
#   docker compose up -d
#
# Sobe sozinho e é útil sozinho: um workload que só precisa de S3 não paga o
# custo de subir Spark junto.

name: dataeng-foundation

include:
  - path: ../network/rede.yml

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      # 9002 e não 9000: a porta nativa do ClickHouse é a 9000, e os dois sobem
      # juntos. Dentro da rede os serviços continuam falando com `minio:9000`.
      - "9002:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [dados]

  # Os mesmos nomes que platform/aws/foundation cria na AWS.
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: lakehouse-minio-setup
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      for b in sandbox-lake-configs sandbox-lake-raw-local sandbox-lake-curated-local sandbox-lake-logs-local sandbox-lakehouse; do
        mc mb --ignore-existing local/$$b;
      done &&
      echo 'buckets prontos'
      "
    networks: [dados]

volumes:
  minio-data:
