# O cluster local, declarado — o análogo do que a VPC é do lado AWS.
#
# kind roda os nós do Kubernetes como contêineres no Docker que você já tem
# (aqui, o OrbStack). Não há VM nova: é uma camada dentro da que já está de pé.
#
# Sobe com `scripts/k8s-up.sh`, que expande ${REPO_ROOT} antes de aplicar — o
# caminho do repositório é da máquina, não do repositório.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dataeng

nodes:
  - role: control-plane
    extraMounts:
      # O repositório inteiro dentro do nó: é assim que os pods do Spark
      # enxergam os mesmos scripts que o Glue executa na nuvem, sem cópia e sem
      # imagem nova a cada edição — o equivalente do
      # `- ../../../..:/workspace:ro` do Compose.
      - hostPath: ${REPO_ROOT}
        containerPath: /repo
        readOnly: true
