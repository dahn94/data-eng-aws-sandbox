apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
spec:
  replicas: 1
  selector: {matchLabels: {app: iceberg-rest}}
  template:
    metadata: {labels: {app: iceberg-rest}}
    spec:
      # O catálogo não sobe antes do banco dele: sem isto o pod entra em
      # CrashLoopBackOff nos primeiros segundos e polui o diagnóstico.
      initContainers:
        - name: espera-o-banco
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          command: ["sh", "-c", "until pg_isready -h catalog-db -U {{ .Values.db.user }}; do sleep 2; done"]
      containers:
        - name: iceberg-rest
          image: "{{ .Values.rest.image.repository }}:{{ .Values.rest.image.tag }}"
          env:
            - {name: CATALOG_URI, value: "jdbc:postgresql://catalog-db:5432/{{ .Values.db.name }}"}
            - {name: CATALOG_JDBC_USER, value: "{{ .Values.db.user }}"}
            - {name: CATALOG_JDBC_PASSWORD, value: "{{ .Values.db.password }}"}
            - {name: AWS_ACCESS_KEY_ID, value: "{{ .Values.rest.s3.accessKey }}"}
            - {name: AWS_SECRET_ACCESS_KEY, value: "{{ .Values.rest.s3.secretKey }}"}
            - {name: AWS_REGION, value: "{{ .Values.rest.s3.region }}"}
            - {name: CATALOG_WAREHOUSE, value: "s3://{{ .Values.rest.warehouse }}/"}
            - {name: CATALOG_IO__IMPL, value: org.apache.iceberg.aws.s3.S3FileIO}
            - {name: CATALOG_S3_ENDPOINT, value: "{{ .Values.rest.s3.endpoint }}"}
            - {name: CATALOG_S3_PATH__STYLE__ACCESS, value: "true"}
          ports: [{name: http, containerPort: 8181}]
          readinessProbe:
            httpGet: {path: /v1/config, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources: {{- toYaml .Values.rest.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
spec:
  selector: {app: iceberg-rest}
  ports: [{name: http, port: 8181, targetPort: http}]
