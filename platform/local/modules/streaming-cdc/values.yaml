debezium:
  version: 2.7.3.Final
schemaRegistry:
  image: {repository: confluentinc/cp-schema-registry, tag: "7.5.0"}
kafkaUi:
  image: {repository: provectuslabs/kafka-ui, tag: v0.7.2}
  enabled: true

# Endereço que um cliente FORA do cluster usa para achar o broker. Com
# `kubectl port-forward svc/kafka 29092:29092`, é localhost.
externalHost: localhost

# Os jars do Avro/Schema Registry, baixados por scripts/fetch-jars.sh. Ficam
# num subdiretório do plugin.path: montar em /kafka/libs sobrescreveria as
# bibliotecas do próprio Connect e o pod não subiria.
connect:
  repoHostPath: /repo
  jarsSubPath: platform/local/services/streaming-cdc/jars/debezium

persistence:
  kafka: 10Gi
  zookeeper: 5Gi

resources:
  kafka: {requests: {cpu: 200m, memory: 1Gi}, limits: {memory: 3Gi}}
  zookeeper: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 1Gi}}
  connect: {requests: {cpu: 200m, memory: 1Gi}, limits: {memory: 3Gi}}
  schemaRegistry: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 1Gi}}
  kafkaUi: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
