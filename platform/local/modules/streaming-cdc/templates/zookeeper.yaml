apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: zookeeper-data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.persistence.zookeeper }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: zookeeper}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: zookeeper}}
  template:
    metadata: {labels: {app: zookeeper}}
    spec:
      containers:
        - name: zookeeper
          image: "debezium/zookeeper:{{ .Values.debezium.version }}"
          env:
            - {name: ZOOKEEPER_CLIENT_PORT, value: "2181"}
            - {name: ZOOKEEPER_TICK_TIME, value: "2000"}
          ports: [{name: client, containerPort: 2181}]
          readinessProbe:
            exec: {command: ["sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok"]}
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /zookeeper/data}]
          resources: {{- toYaml .Values.resources.zookeeper | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: zookeeper-data}
---
apiVersion: v1
kind: Service
metadata: {name: zookeeper}
spec:
  selector: {app: zookeeper}
  ports: [{name: client, port: 2181, targetPort: client}]
