apiVersion: apps/v1
kind: Deployment
metadata: {name: schema-registry}
spec:
  replicas: 1
  selector: {matchLabels: {app: schema-registry}}
  template:
    metadata: {labels: {app: schema-registry}}
    spec:
      containers:
        - name: schema-registry
          image: "{{ .Values.schemaRegistry.image.repository }}:{{ .Values.schemaRegistry.image.tag }}"
          env:
            - {name: SCHEMA_REGISTRY_HOST_NAME, value: schema-registry}
            - {name: SCHEMA_REGISTRY_LISTENERS, value: "http://0.0.0.0:8081"}
            - {name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, value: "PLAINTEXT://kafka:9092"}
          ports: [{name: http, containerPort: 8081}]
          resources: {{- toYaml .Values.resources.schemaRegistry | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: schema-registry}
spec:
  selector: {app: schema-registry}
  ports: [{name: http, port: 8081, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: connect}
spec:
  replicas: 1
  selector: {matchLabels: {app: connect}}
  template:
    metadata: {labels: {app: connect}}
    spec:
      containers:
        - name: connect
          image: "debezium/connect:{{ .Values.debezium.version }}"
          env:
            - {name: BOOTSTRAP_SERVERS, value: "kafka:9092"}
            - {name: GROUP_ID, value: "1"}
            - {name: CONFIG_STORAGE_TOPIC, value: my_connect_configs}
            - {name: OFFSET_STORAGE_TOPIC, value: my_connect_offsets}
            - {name: STATUS_STORAGE_TOPIC, value: my_connect_statuses}
            # Avro + Schema Registry: é o formato que o job Glue de streaming e
            # a tabela Kafka do ClickHouse esperam.
            - {name: KEY_CONVERTER, value: io.confluent.connect.avro.AvroConverter}
            - {name: VALUE_CONVERTER, value: io.confluent.connect.avro.AvroConverter}
            - {name: CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL, value: "http://schema-registry:8081"}
            - {name: CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL, value: "http://schema-registry:8081"}
            - {name: REST_ADVERTISED_HOST_NAME, value: connect}
            - {name: REST_PORT, value: "8083"}
            # Permite que o JSON do connector referencie um arquivo de
            # propriedades em vez de carregar a senha do Postgres em texto.
            - {name: CONNECT_CONFIG_PROVIDERS, value: file}
            - {name: CONNECT_CONFIG_PROVIDERS_FILE_CLASS, value: org.apache.kafka.common.config.provider.FileConfigProvider}
          ports: [{name: http, containerPort: 8083}]
          readinessProbe:
            httpGet: {path: /connectors, port: http}
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - {name: jars, mountPath: /kafka/connect/confluent-avro, readOnly: true}
          resources: {{- toYaml .Values.resources.connect | nindent 12 }}
      volumes:
        - name: jars
          hostPath:
            path: {{ .Values.connect.repoHostPath }}/{{ .Values.connect.jarsSubPath }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata: {name: connect}
spec:
  selector: {app: connect}
  ports: [{name: http, port: 8083, targetPort: http}]
{{- if .Values.kafkaUi.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka-ui}
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka-ui}}
  template:
    metadata: {labels: {app: kafka-ui}}
    spec:
      containers:
        - name: kafka-ui
          image: "{{ .Values.kafkaUi.image.repository }}:{{ .Values.kafkaUi.image.tag }}"
          env:
            - {name: KAFKA_CLUSTERS_0_NAME, value: local}
            - {name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS, value: "kafka:9092"}
            - {name: KAFKA_CLUSTERS_0_SCHEMAREGISTRY, value: "http://schema-registry:8081"}
            - {name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME, value: debezium-connect}
            - {name: KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS, value: "http://connect:8083"}
            - {name: DYNAMIC_CONFIG_ENABLED, value: "true"}
          ports: [{name: http, containerPort: 8080}]
          resources: {{- toYaml .Values.resources.kafkaUi | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: kafka-ui}
spec:
  selector: {app: kafka-ui}
  ports: [{name: http, port: 8080, targetPort: http}]
{{- end }}
