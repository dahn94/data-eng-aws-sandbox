apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: kafka-data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.persistence.kafka }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      initContainers:
        - name: espera-o-zookeeper
          image: "debezium/zookeeper:{{ .Values.debezium.version }}"
          command: ["sh", "-c", "until echo ruok | nc -w 2 zookeeper 2181 | grep -q imok; do sleep 2; done"]
      containers:
        - name: kafka
          image: "debezium/kafka:{{ .Values.debezium.version }}"
          env:
            - {name: KAFKA_BROKER_ID, value: "1"}
            - {name: ZOOKEEPER_CONNECT, value: "zookeeper:2181"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:29092"}
            # O anunciado precisa ser resolvível por quem conecta: `kafka`
            # dentro do cluster, e o host do port-forward fora dele.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092,PLAINTEXT_EXTERNAL://{{ .Values.externalHost }}:29092"
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
          ports:
            - {name: internal, containerPort: 9092}
            - {name: external, containerPort: 29092}
          readinessProbe:
            exec: {command: ["sh", "-c", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]}
            initialDelaySeconds: 20
            periodSeconds: 15
          volumeMounts: [{name: data, mountPath: /kafka/data}]
          resources: {{- toYaml .Values.resources.kafka | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: kafka-data}
---
apiVersion: v1
kind: Service
metadata: {name: kafka}
spec:
  selector: {app: kafka}
  ports:
    - {name: internal, port: 9092, targetPort: internal}
    - {name: external, port: 29092, targetPort: external}
