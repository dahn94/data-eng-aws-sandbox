apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: metabase-db}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.db.persistence.size }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: metabase-db}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: metabase-db}}
  template:
    metadata: {labels: {app: metabase-db}}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          env:
            - {name: POSTGRES_DB, value: "{{ .Values.db.name }}"}
            - {name: POSTGRES_USER, value: "{{ .Values.db.user }}"}
            - {name: POSTGRES_PASSWORD, value: "{{ .Values.db.password }}"}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: pg, containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "{{ .Values.db.user }}", "-d", "{{ .Values.db.name }}"]}
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: metabase-db}
---
apiVersion: v1
kind: Service
metadata: {name: metabase-db}
spec:
  selector: {app: metabase-db}
  ports: [{name: pg, port: 5432, targetPort: pg}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: metabase}
spec:
  replicas: 1
  selector: {matchLabels: {app: metabase}}
  template:
    metadata: {labels: {app: metabase}}
    spec:
      containers:
        - name: metabase
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - {name: MB_DB_TYPE, value: postgres}
            - {name: MB_DB_HOST, value: metabase-db}
            - {name: MB_DB_PORT, value: "5432"}
            - {name: MB_DB_DBNAME, value: "{{ .Values.db.name }}"}
            - {name: MB_DB_USER, value: "{{ .Values.db.user }}"}
            - {name: MB_DB_PASS, value: "{{ .Values.db.password }}"}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: metabase}
spec:
  selector: {app: metabase}
  ports: [{name: http, port: 3000, targetPort: http}]
