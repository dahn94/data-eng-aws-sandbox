{{- if not .Values.adminPassword }}
{{- fail "search-opensearch: defina adminPassword — o OpenSearch 2.12+ recusa subir sem ela" }}
{{- end }}
# StatefulSet e não dois Deployments: os nós precisam de identidade estável para
# se descobrirem (`opensearch-0`, `opensearch-1`), que é o que o Compose
# emulava à mão com `opensearch-node1` e `opensearch-node2`.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
spec:
  serviceName: opensearch
  replicas: {{ .Values.replicas }}
  selector: {matchLabels: {app: opensearch}}
  template:
    metadata: {labels: {app: opensearch}}
    spec:
      containers:
        - name: opensearch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - {name: cluster.name, value: opensearch-cluster}
            - name: node.name
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: discovery.seed_hosts, value: opensearch}
            - name: cluster.initial_cluster_manager_nodes
              value: "{{- range $i := until (int .Values.replicas) }}opensearch-{{ $i }}{{ if lt (add1 $i) (int $.Values.replicas) }},{{ end }}{{- end }}"
            - {name: bootstrap.memory_lock, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms{{ .Values.heap }} -Xmx{{ .Values.heap }}"}
            - {name: OPENSEARCH_INITIAL_ADMIN_PASSWORD, value: "{{ .Values.adminPassword }}"}
          ports:
            - {name: http, containerPort: 9200}
            - {name: perf, containerPort: 9600}
          volumeMounts: [{name: data, mountPath: /usr/share/opensearch/data}]
          resources: {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.persistence.size }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
spec:
  clusterIP: None
  selector: {app: opensearch}
  ports:
    - {name: http, port: 9200, targetPort: http}
    - {name: perf, port: 9600, targetPort: perf}
