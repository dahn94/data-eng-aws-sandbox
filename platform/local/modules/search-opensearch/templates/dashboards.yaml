apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-dashboards
spec:
  replicas: 1
  selector: {matchLabels: {app: opensearch-dashboards}}
  template:
    metadata: {labels: {app: opensearch-dashboards}}
    spec:
      containers:
        - name: dashboards
          image: "{{ .Values.dashboards.image.repository }}:{{ .Values.dashboards.image.tag }}"
          env:
            - name: OPENSEARCH_HOSTS
              value: '["{{- range $i := until (int .Values.replicas) }}https://opensearch-{{ $i }}.opensearch:9200{{ if lt (add1 $i) (int $.Values.replicas) }}","{{ end }}{{- end }}"]'
          ports: [{name: http, containerPort: 5601}]
          resources: {{- toYaml .Values.dashboards.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-dashboards
spec:
  selector: {app: opensearch-dashboards}
  ports: [{name: http, port: 5601, targetPort: http}]
