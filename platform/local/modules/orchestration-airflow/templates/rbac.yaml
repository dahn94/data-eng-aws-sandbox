# O DAG cria, acompanha e apaga pods no PRÓPRIO namespace — nada além disso.
# É o análogo mínimo do que a role de execução da Step Function tem na AWS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-jobs
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/status]
    verbs: [create, get, list, watch, delete, patch]
  # O operador assiste aos eventos do pod enquanto ele parte, e é assim que
  # explica uma partida que não acontece. Sem esta regra ele leva 403, e o
  # `cleanup` mascara o erro reportando "pod returned a failure" com um
  # `remote_pod` velho — o pod termina bem e a tarefa falha mesmo assim.
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-jobs
subjects:
  - {kind: ServiceAccount, name: airflow}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: airflow-jobs}
