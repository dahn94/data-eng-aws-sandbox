apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-home
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.persistence.size }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: airflow}}
  template:
    metadata: {labels: {app: airflow}}
    spec:
      serviceAccountName: airflow
      containers:
        - name: airflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["airflow", "standalone"]
          env:
            - {name: AIRFLOW__CORE__LOAD_EXAMPLES, value: "false"}
            - {name: AIRFLOW__CORE__DAGS_FOLDER, value: /opt/airflow/dags}
            # O DAG é o mesmo arquivo nos dois caminhos; isto diz a ele
            # que aqui cada tarefa vira um pod, e não um `docker exec`.
            - {name: MODO_EXECUCAO, value: kubernetes}
            # O DAG não adivinha em que namespace está nem com que imagem
            # rodar os jobs: tudo chega por variável, vinda daqui.
            - name: JOBS_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: JOBS_IMAGE, value: "{{ .Values.jobs.image }}"}
            - {name: JOBS_REPO_HOST_PATH, value: "{{ .Values.dags.repoHostPath }}"}
            - {name: JOBS_REPO_MOUNT_PATH, value: "{{ .Values.jobs.repoMountPath }}"}
            - {name: AWS_ACCESS_KEY_ID, value: "{{ .Values.jobs.s3.accessKey }}"}
            - {name: AWS_SECRET_ACCESS_KEY, value: "{{ .Values.jobs.s3.secretKey }}"}
            - {name: AWS_REGION, value: "{{ .Values.jobs.s3.region }}"}
            - {name: AWS_ENDPOINT_URL_S3, value: "{{ .Values.jobs.s3.endpoint }}"}
            - {name: ICEBERG_REST_URI, value: "{{ .Values.jobs.icebergRestUri }}"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /api/v2/version, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - {name: home, mountPath: /opt/airflow}
            - name: dags
              mountPath: /opt/airflow/dags/{{ .Values.dags.name }}
              readOnly: true
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: home
          persistentVolumeClaim: {claimName: airflow-home}
        - name: dags
          hostPath:
            path: {{ .Values.dags.repoHostPath }}/{{ .Values.dags.subPath }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
spec:
  selector: {app: airflow}
  ports: [{name: http, port: 8080, targetPort: http}]
