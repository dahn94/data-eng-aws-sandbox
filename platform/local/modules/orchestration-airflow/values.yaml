# Modo `standalone` de propósito: um pod, banco embutido, sem Celery nem Redis.
# É um laboratório para ver a sequência rodar, não uma instalação de produção.
image:
  repository: dataeng-sandbox/airflow
  tag: 3.1.3-k8s

# Os DAGs moram nos workloads, não aqui: a definição da sequência pertence a
# quem é orquestrado, como a Step Function pertence ao main.tf do workload.
# O caminho é relativo à raiz do repositório, montada no nó como /repo.
dags:
  repoHostPath: /repo
  subPath: workloads/amazonsales/local/dags
  name: amazonsales

# O que o DAG cria a cada tarefa: um pod com a imagem do Glue, rodando
# spark-submit sobre os mesmos scripts que a nuvem executa.
jobs:
  image: dataeng-sandbox/glue:5.0.10-gx
  repoMountPath: /workspace
  s3:
    endpoint: http://minio:9000
    region: us-east-1
    accessKey: minioadmin
    secretKey: minioadmin
  icebergRestUri: http://iceberg-rest:8181
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {memory: 6Gi}

persistence:
  size: 5Gi

resources:
  requests: {cpu: 200m, memory: 1Gi}
  limits: {memory: 3Gi}
