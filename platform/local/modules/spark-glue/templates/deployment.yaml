apiVersion: apps/v1
kind: Deployment
metadata:
  name: glue
spec:
  replicas: 1
  selector: {matchLabels: {app: glue}}
  template:
    metadata: {labels: {app: glue}}
    spec:
      containers:
        - name: glue
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # O ENTRYPOINT da imagem é `bash -l`, então o comando entra como
          # argumento dele: uma lista ["tail","-f",...] viraria
          # `bash -l tail -f ...` e sairia com 0 sem dizer nada.
          args: ["-c", "tail -f /dev/null"]
          workingDir: {{ .Values.repo.mountPath }}
          env:
            - {name: AWS_ACCESS_KEY_ID, value: "{{ .Values.s3.accessKey }}"}
            - {name: AWS_SECRET_ACCESS_KEY, value: "{{ .Values.s3.secretKey }}"}
            - {name: AWS_REGION, value: "{{ .Values.s3.region }}"}
            - {name: AWS_ENDPOINT_URL_S3, value: "{{ .Values.s3.endpoint }}"}
            - {name: ICEBERG_REST_URI, value: "{{ .Values.icebergRestUri }}"}
          volumeMounts:
            - {name: repo, mountPath: "{{ .Values.repo.mountPath }}", readOnly: true}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: repo
          hostPath: {path: "{{ .Values.repo.hostPath }}", type: Directory}
