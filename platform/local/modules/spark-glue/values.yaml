# Responde "roda como na nuvem?". Compare com spark-oss, que responde
# "o código depende de fornecedor?".
image:
  repository: dataeng-sandbox/glue
  tag: 5.0.10-gx

# O repositório, montado no nó pelo cluster (ver platform/local/cluster/k3d.yaml).
# É o que faz o pod executar OS MESMOS arquivos que o Glue executa na nuvem.
repo:
  hostPath: /repo
  mountPath: /workspace

s3:
  endpoint: http://minio:9000
  region: us-east-1
  accessKey: minioadmin
  secretKey: minioadmin
icebergRestUri: http://iceberg-rest:8181

resources:
  requests: {cpu: 500m, memory: 2Gi}
  limits: {memory: 6Gi}
