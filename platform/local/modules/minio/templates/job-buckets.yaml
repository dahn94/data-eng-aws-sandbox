# Os mesmos nomes que platform/aws/foundation cria na AWS.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: "{{ .Values.mc.repository }}:{{ .Values.mc.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "esperando o minio"; sleep 2
              done
              for b in {{ join " " .Values.buckets }}; do
                mc mb --ignore-existing "local/$b"
              done
              echo 'buckets prontos'
          env:
            - {name: MINIO_ROOT_USER, value: "{{ .Values.credentials.accessKey }}"}
            - {name: MINIO_ROOT_PASSWORD, value: "{{ .Values.credentials.secretKey }}"}
