# O nome do Service é o endereço: os scripts falam com `http://minio:9000`,
# exatamente como falavam no Compose. É o que permite não tocar em script
# nenhum ao trocar de motor de execução.
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: api}
    - {name: console, port: 9001, targetPort: console}
