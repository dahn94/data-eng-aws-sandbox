apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
spec:
  replicas: 1
  selector: {matchLabels: {app: trino}}
  template:
    metadata:
      labels: {app: trino}
      annotations:
        # Reinicia o pod quando o catálogo muda: o Trino lê os .properties
        # só na subida.
        checksum/catalog: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: trino
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /v1/info, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - {name: catalog, mountPath: /etc/trino/catalog}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: catalog
          configMap: {name: trino-catalog}
