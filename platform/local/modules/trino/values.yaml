image:
  repository: trinodb/trino
  tag: "476"

# Aponta para o MESMO catálogo Iceberg que o Spark usa — é assim que se verifica
# que tabelas escritas por um motor são legíveis por outro, sem cópia.
catalog:
  restUri: http://iceberg-rest:8181
  warehouse: s3://sandbox-lakehouse/
  s3:
    endpoint: http://minio:9000
    region: us-east-1
    accessKey: minioadmin
    secretKey: minioadmin

resources:
  requests: {cpu: 200m, memory: 1Gi}
  limits: {memory: 4Gi}
