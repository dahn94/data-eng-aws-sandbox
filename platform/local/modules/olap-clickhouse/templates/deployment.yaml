apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: clickhouse}}
  template:
    metadata: {labels: {app: clickhouse}}
    spec:
      containers:
        - name: clickhouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          env:
            - {name: CLICKHOUSE_DB, value: "{{ .Values.database }}"}
            - {name: CLICKHOUSE_USER, value: "{{ .Values.user }}"}
            - {name: CLICKHOUSE_PASSWORD, value: "{{ .Values.password }}"}
          ports:
            - {name: http, containerPort: 8123}
            - {name: native, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/clickhouse}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: clickhouse-data}
