# Se um script roda aqui, roda em qualquer Spark. Se só roda no spark-glue,
# existe uma amarra — e achar qual é o exercício.
image:
  repository: dataeng-sandbox/spark-oss
  tag: 3.5.7-gx

repo:
  hostPath: /repo
  mountPath: /workspace

s3:
  endpoint: http://minio:9000
  region: us-east-1
  accessKey: minioadmin
  secretKey: minioadmin
icebergRestUri: http://iceberg-rest:8181

# Cache dos jars entre execuções, para o --packages não rebaixar tudo.
ivyCache:
  size: 2Gi

resources:
  requests: {cpu: 500m, memory: 2Gi}
  limits: {memory: 6Gi}
