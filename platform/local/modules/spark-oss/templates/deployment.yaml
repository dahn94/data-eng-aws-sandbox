apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-oss-ivy
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.ivyCache.size }}}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-oss
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: spark-oss}}
  template:
    metadata: {labels: {app: spark-oss}}
    spec:
      containers:
        - name: spark-oss
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["tail", "-f", "/dev/null"]
          workingDir: {{ .Values.repo.mountPath }}
          securityContext: {runAsUser: 0}
          env:
            - {name: AWS_ACCESS_KEY_ID, value: "{{ .Values.s3.accessKey }}"}
            - {name: AWS_SECRET_ACCESS_KEY, value: "{{ .Values.s3.secretKey }}"}
            - {name: AWS_REGION, value: "{{ .Values.s3.region }}"}
            - {name: AWS_ENDPOINT_URL_S3, value: "{{ .Values.s3.endpoint }}"}
            - {name: ICEBERG_REST_URI, value: "{{ .Values.icebergRestUri }}"}
            - {name: HOME, value: /tmp}
          volumeMounts:
            - {name: repo, mountPath: "{{ .Values.repo.mountPath }}", readOnly: true}
            - {name: ivy, mountPath: /tmp/.ivy2}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: repo
          hostPath: {path: "{{ .Values.repo.hostPath }}", type: Directory}
        - name: ivy
          persistentVolumeClaim: {claimName: spark-oss-ivy}
