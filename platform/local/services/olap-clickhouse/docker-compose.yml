name: dataeng-clickhouse

# Entra na rede compartilhada de platform/local/network, para que outros
# serviços e os workloads o alcancem pelo nome `clickhouse`.
include:
  - path: ../../network/rede.yml

services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8}

    container_name: ${CLICKHOUSE_CONTAINER_NAME:-clickhouse}

    restart: unless-stopped

    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"

    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    volumes:
      # Volume nomeado, e não um caminho de host: `/mnt/s3files` não existe
      # em toda máquina, e o bind silenciosamente criava um diretório vazio.
      - clickhouse-data:/var/lib/clickhouse

    networks: [dados]

volumes:
  clickhouse-data:
