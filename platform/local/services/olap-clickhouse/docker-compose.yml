name: dataeng-clickhouse

# Entra na rede compartilhada de platform/local/network, para que outros
# serviços e os workloads o alcancem pelo nome `clickhouse`.
include:
  - path: ../../network/rede.yml

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8

    container_name: clickhouse

    restart: unless-stopped

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    volumes:
      - /mnt/s3files/clickhouse:/var/lib/clickhouse

    networks: [dados]