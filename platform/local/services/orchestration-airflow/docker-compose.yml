# Airflow: o orquestrador local, no lugar do Step Functions.
#
# Orquestração é a única diferença entre AWS e local que NÃO é configuração —
# Step Functions e Airflow são produtos diferentes, então a sequência é
# declarada duas vezes. Os jobs orquestrados continuam sendo os mesmos arquivos.
#
# Modo `standalone` de propósito: um contêiner, banco embutido, sem Celery nem
# Redis. É um laboratório para ver a sequência rodar, não uma instalação de
# produção — e a diferença está registrada no README.
#
#   docker compose up -d
#   # usuário admin e senha aparecem no log:
#   docker compose logs airflow | grep -i password

name: dataeng-airflow

# Rede compartilhada: o DAG dispara `docker exec` no contêiner do Spark, e
# estar na mesma rede mantém o ambiente coerente com o resto.
include:
  - path: ../../network/rede.yml

services:
  airflow:
    networks: [dados]
    build: .
    image: dataeng-sandbox/airflow:${AIRFLOW_VERSION:-3.1.3-docker}
    container_name: ${AIRFLOW_CONTAINER_NAME:-airflow}
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # O DAG dispara os jobs com `docker exec` no contêiner do Spark, então
      # este contêiner precisa falar com o Docker da máquina.
      DOCKER_HOST: unix:///var/run/docker.sock
      # O nome do contêiner alvo do `docker exec` do DAG. Chega aqui pelo
      # .env do workload, para que o DAG não precise adivinhá-lo.
      GLUE_CONTAINER_NAME: ${GLUE_CONTAINER_NAME:-lakehouse-glue}
    volumes:
      # Os DAGs moram nos workloads, não aqui: a definição da sequência
      # pertence a quem é orquestrado, como a Step Function pertence ao main.tf
      # do workload.
      # Caminhos relativos AQUI resolvem a partir desta pasta, não da pasta do
      # workload que inclui — por isso o default aponta para amazonsales.
      - ${AIRFLOW_DAGS_PATH:-../../../../workloads/amazonsales/local/dags}:/opt/airflow/dags/${AIRFLOW_DAGS_NAME:-amazonsales}:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - airflow-db:/opt/airflow
    ports:
      - "${AIRFLOW_PORT:-8090}:8080"
    command: ["airflow", "standalone"]

volumes:
  airflow-db:
