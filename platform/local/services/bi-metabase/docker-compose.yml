name: dataeng-metabase

# Entra na rede compartilhada de platform/local/network: é por ela que
# esta ferramenta alcança os motores (ClickHouse, Trino) para consultar.
include:
  - path: ../../network/rede.yml

services:
  db:
    networks: [dados]
    image: postgres:${METABASE_DB_VERSION:-13}
    container_name: ${METABASE_DB_CONTAINER_NAME:-metabase-postgres}
    restart: always

    environment:
      POSTGRES_DB: ${METABASE_DB_NAME:-metabaseappdb}
      POSTGRES_USER: ${METABASE_DB_USER:-metabaseuser}
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:-metabasepassword}

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METABASE_DB_USER:-metabaseuser} -d ${METABASE_DB_NAME:-metabaseappdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    networks: [dados]
    image: metabase/metabase:${METABASE_VERSION:-v0.56.5}
    container_name: ${METABASE_CONTAINER_NAME:-metabase}
    restart: always

    ports:
      - "${METABASE_PORT:-3000}:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME:-metabaseappdb}
      MB_DB_PORT: 5432
      MB_DB_USER: ${METABASE_DB_USER:-metabaseuser}
      MB_DB_PASS: ${METABASE_DB_PASSWORD:-metabasepassword}
      MB_DB_HOST: db

    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
