# O mesmo catálogo Iceberg que o Spark usa — é esse o ponto. Nenhuma cópia,
# nenhuma sincronização: os dois motores leem as mesmas tabelas, pelo mesmo
# catálogo REST, sobre o mesmo storage.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://sandbox-lakehouse/

# Storage: MinIO falando a API do S3.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
