name: dataeng-superset

# Entra na rede compartilhada de platform/local/network: é por ela que
# esta ferramenta alcança os motores (ClickHouse, Trino) para consultar.
include:
  - path: ../../network/rede.yml

services:

  postgres:
    networks: [dados]
    image: postgres:${SUPERSET_DB_VERSION:-15}
    container_name: ${SUPERSET_DB_CONTAINER_NAME:-superset-postgres}

    restart: always

    environment:
      POSTGRES_DB: ${SUPERSET_DB_NAME:-superset}
      POSTGRES_USER: ${SUPERSET_DB_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:-superset}

    volumes:
      - postgres_data:/var/lib/postgresql/data

  superset:
    networks: [dados]
    build: .

    container_name: ${SUPERSET_CONTAINER_NAME:-superset}

    restart: always

    depends_on:
      - postgres

    ports:
      - "${SUPERSET_PORT:-8088}:8088"

    environment:
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-4ba9fdc27cdba4735e1a39e93948875890ebb3b297824898abd1685d6cb9fc7b}"

      SUPERSET_DATABASE_URI: postgresql+psycopg2://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:-superset}@postgres:5432/${SUPERSET_DB_NAME:-superset}

    volumes:
      - superset_home:/app/superset_home

    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname admin
      --lastname admin
      --email admin@admin.com
      --password admin || true &&

      superset init &&

      superset run -h 0.0.0.0 -p 8088
      "

volumes:
  postgres_data:
  superset_home:
