name: dataeng-superset

# Entra na rede compartilhada de platform/local/network: é por ela que
# esta ferramenta alcança os motores (ClickHouse, Trino) para consultar.
include:
  - path: ../../network/rede.yml

services:

  postgres:
    networks: [dados]
    image: postgres:15
    container_name: superset-postgres

    restart: always

    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset

    volumes:
      - postgres_data:/var/lib/postgresql/data

  superset:
    networks: [dados]
    build: .

    container_name: superset

    restart: always

    depends_on:
      - postgres

    ports:
      - "8088:8088"

    environment:
      SUPERSET_SECRET_KEY: "4ba9fdc27cdba4735e1a39e93948875890ebb3b297824898abd1685d6cb9fc7b"

      SUPERSET_DATABASE_URI: postgresql+psycopg2://superset:superset@postgres:5432/superset

    volumes:
      - superset_home:/app/superset_home

    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname admin
      --lastname admin
      --email admin@admin.com
      --password admin || true &&

      superset init &&

      superset run -h 0.0.0.0 -p 8088
      "

volumes:
  postgres_data:
  superset_home:
