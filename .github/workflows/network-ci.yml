name: aws-platform/network CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "aws-platform/network/**"
      - "aws-platform/modules/vpc/**"
      - .github/workflows/network-ci.yml
      - .github/workflows/terraform-reusable.yml
  push:
    branches: [develop, main]
    paths:
      - "aws-platform/network/**"
      - "aws-platform/modules/vpc/**"
      - .github/workflows/network-ci.yml
      - .github/workflows/terraform-reusable.yml

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    secrets: inherit
    with:
      working_directory: aws-platform/network

