name: workloads/query-lambda CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "workloads/query-lambda/**"
      - "modules/lambda_ecr/**"
      - .github/workflows/workload-query-lambda-ci.yml
      - .github/workflows/terraform-reusable.yml
  push:
    branches: [develop, main]
    paths:
      - "workloads/query-lambda/**"
      - "modules/lambda_ecr/**"
      - .github/workflows/workload-query-lambda-ci.yml
      - .github/workflows/terraform-reusable.yml

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    secrets: inherit
    with:
      working_directory: workloads/query-lambda/aws/infra

