name: platform/rds CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "platform/rds/**"
      - "modules/rds/**"
      - .github/workflows/platform-rds-ci.yml
      - .github/workflows/terraform-reusable.yml
  push:
    branches: [develop, main]
    paths:
      - "platform/rds/**"
      - "modules/rds/**"
      - .github/workflows/platform-rds-ci.yml
      - .github/workflows/terraform-reusable.yml

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    secrets: inherit
    with:
      working_directory: platform/rds
      needs_rds_password: true
