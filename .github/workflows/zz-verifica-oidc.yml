name: verifica OIDC
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: claims do token
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          p=$(echo "$tok" | cut -d. -f2)
          pad=$(( (4 - ${#p} % 4) % 4 )); p="$p$(printf '=%.0s' $(seq 1 $pad))"
          echo "$p" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{sub,aud,repository,repository_id,repository_owner,repository_owner_id,job_workflow_ref}'
