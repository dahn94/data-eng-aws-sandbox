name: aws-platform/rds CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "aws-platform/rds/**"
      - "aws-platform/modules/rds/**"
      - .github/workflows/rds-ci.yml
      - .github/workflows/terraform-reusable.yml
  push:
    branches: [develop, main]
    paths:
      - "aws-platform/rds/**"
      - "aws-platform/modules/rds/**"
      - .github/workflows/rds-ci.yml
      - .github/workflows/terraform-reusable.yml

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    secrets: inherit
    with:
      working_directory: aws-platform/rds
      needs_rds_password: true
