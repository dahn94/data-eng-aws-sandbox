name: workloads/zero-etl CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "modules/rds/**"
      - "workloads/zero-etl/**"
      # O warehouse vem de um módulo compartilhado: mexer nele sem disparar
      # este workflow deixaria a mudança sem plan.
      - "modules/redshift-serverless/**"
      - .github/workflows/workload-zero-etl-ci.yml
      - .github/workflows/terraform-reusable.yml
  push:
    branches: [develop, main]
    paths:
      - "modules/rds/**"
      - "workloads/zero-etl/**"
      - "modules/redshift-serverless/**"
      - .github/workflows/workload-zero-etl-ci.yml
      - .github/workflows/terraform-reusable.yml

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    secrets: inherit
    with:
      working_directory: workloads/zero-etl/aws/infra
      needs_redshift_password: true
