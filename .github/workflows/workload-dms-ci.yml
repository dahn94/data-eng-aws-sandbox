name: workloads/dms CI/CD

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "platform/aws/modules/rds/**"
      - "workloads/dms/**"
      - "platform/aws/modules/dms/**"
      - .github/workflows/workload-dms-ci.yml
      - .github/workflows/terraform-reusable.yml
  push:
    branches: [develop, main]
    paths:
      - "platform/aws/modules/rds/**"
      - "workloads/dms/**"
      - "platform/aws/modules/dms/**"
      - .github/workflows/workload-dms-ci.yml
      - .github/workflows/terraform-reusable.yml

jobs:
  terraform:
    uses: ./.github/workflows/terraform-reusable.yml
    secrets: inherit
    with:
      working_directory: workloads/dms/aws/infra
      needs_rds_password: true
