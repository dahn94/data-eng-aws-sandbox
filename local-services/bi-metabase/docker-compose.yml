services:
  db:
    image: postgres:13
    container_name: metabase-postgres
    restart: always

    environment:
      POSTGRES_DB: metabaseappdb
      POSTGRES_USER: metabaseuser
      POSTGRES_PASSWORD: metabasepassword

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabaseuser -d metabaseappdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:v0.56.5
    container_name: metabase
    restart: always

    ports:
      - "3000:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: metabaseuser
      MB_DB_PASS: metabasepassword
      MB_DB_HOST: db

    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
