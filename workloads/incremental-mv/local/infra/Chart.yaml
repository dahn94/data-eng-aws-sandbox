# A infraestrutura local deste workload no Kubernetes.
#
# Na AWS ele usa Redshift (`../../aws/infra`); local, o motor que exercita o
# mesmo mecanismo de materialized view é o ClickHouse.
#
#   helm dependency build
#   helm install incremental-mv . -n incremental-mv --create-namespace
apiVersion: v2
name: incremental-mv-local
description: O ClickHouse que exercita a materialized view incremental
type: application
version: 0.1.0

dependencies:
  - {name: olap-clickhouse, version: 0.1.0, repository: "file://../../../../platform/local/modules/olap-clickhouse"}
