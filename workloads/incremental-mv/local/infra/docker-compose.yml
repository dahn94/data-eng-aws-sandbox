# A infraestrutura local deste workload.
#
# Na AWS ele usa Redshift (`../../aws/infra`); local, o motor que exercita o
# mesmo mecanismo de materialized view é o ClickHouse. Não é o mesmo produto, e
# o README diz exatamente onde eles divergem.
#
#   docker compose up -d
#   docker compose exec -T clickhouse clickhouse-client --multiquery < ../materialized-view.sql
#
# O nome do contêiner (`incremental-mv-clickhouse`) vem de parametros.env.

name: incremental-mv-local

include:
  - path: ../../../../platform/local/services/olap-clickhouse/docker-compose.yml
    env_file: ./parametros.env
