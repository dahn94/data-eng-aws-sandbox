# A infraestrutura local deste workload — o espelho do que `../../aws/infra`
# declara para a nuvem.
#
# Não redefine serviço nenhum: compõe as peças de `platform/local` de que
# precisa, por `include`. É a mesma relação que o Terraform tem com
# `platform/aws/modules` — o workload consome a plataforma, não a duplica.
#
#   docker compose up -d
#
# O que este workload precisa, e por quê:
#   foundation        MinIO e os buckets, com os nomes que a AWS usa
#   iceberg-catalog   o catálogo Iceberg (o análogo do S3 Tables)
#   spark-glue        onde os jobs rodam, com as libs do Glue
#   trino             para consultar o star schema por outro motor
#   airflow           o DAG que substitui o Step Functions

name: amazonsales-local

# `parametros.env` em toda entrada do include: é ele que dá a cada peça os
# valores DESTE workload (nome de contêiner, porta, versão). Precisa ser
# repetido por entrada — o `include` não tem um env_file de projeto.
include:
  # Sem o `.env` do foundation: ele é gitignored, e um env_file inexistente é
  # erro fatal — num clone novo o `up` morria aqui. As credenciais do MinIO já
  # têm default no compose dele; para trocá-las, use um `.env` NESTE diretório,
  # que tem precedência sobre tudo isto.
  - path: ../../../../platform/local/foundation/docker-compose.yml
    env_file: ./parametros.env
  - path: ../../../../platform/local/services/iceberg-catalog/docker-compose.yml
    env_file: ./parametros.env
  - path: ../../../../platform/local/services/spark-glue/docker-compose.yml
    env_file: ./parametros.env
  - path: ../../../../platform/local/services/trino/docker-compose.yml
    env_file: ./parametros.env
  - path: ../../../../platform/local/services/orchestration-airflow/docker-compose.yml
    env_file: ./parametros.env
