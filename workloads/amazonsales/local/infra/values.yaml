# Os parâmetros com que ESTE workload instancia os modelos de
# platform/local/modules — o análogo do que parametros.env é para o Compose, e
# do que envs/*.tfvars é para o Terraform.
#
# O que não está aqui fica no default do modelo, de propósito: parâmetro
# repetido com o valor do default é ruído que esconde o que de fato é do
# workload.

orchestration-airflow:
  # O DAG deste workload é o que o Airflow monta, e é ele que substitui a
  # máquina de estado.
  dags:
    subPath: workloads/amazonsales/local/dags
    name: amazonsales
